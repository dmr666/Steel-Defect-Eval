# NOTE: input paths were machine-specific; the prefix has been replaced with '.'.
# Edit the path constants near the top if your layout differs from the repo layout.
# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8s-P2 (Paper 3, NEU-DET 钢材表面缺陷): 在标准 YOLOv8s 上增加 stride=4 的 P2 检测头
# 设计要点：
#   1) scales 用 [0.33, 0.50, 1024] = 标准 YOLOv8s 深度/宽度，**不加深度**
#      → v_p2 相对 v_base 的唯一差异就是 P2 检测头（避免"P2+加深"混淆，这是论文二踩过的坑）
#   2) nc=6 + names 与 data/NEU-DET-split/neu_det.yaml 一致（crazing..scratches）

nc: 6
names: ['crazing', 'inclusion', 'patches', 'pitted_surface', 'rolled-in_scale', 'scratches']
scales:
  s: [0.33, 0.50, 1024]  # 标准 YOLOv8s 缩放（深度 0.33 / 宽度 0.50 / max_channels 1024）

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2  ← P2 特征 (stride=4, 128ch), 供 P2 检测头
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4  ← P3 特征（DCSA 替换点之一）
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6  ← P4 特征（DCSA 替换点之一）
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8  ← P5 特征（DCSA 替换点之一）
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                           # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                           # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 16 ← P2 上采样
  - [[-1, 2], 1, Concat, [1]]                     # 17 cat backbone P2 (stride=4)
  - [-1, 3, C2f, [128]]                           # 18 (P2/4-tiny) ← 新增 P2 检测层

  - [-1, 1, Conv, [128, 3, 2]]                    # 19
  - [[-1, 15], 1, Concat, [1]]                    # 20
  - [-1, 3, C2f, [256]]                           # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 22
  - [[-1, 12], 1, Concat, [1]]                    # 23
  - [-1, 3, C2f, [512]]                           # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 25
  - [[-1, 9], 1, Concat, [1]]                     # 26
  - [-1, 3, C2f, [1024]]                          # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Detect, [nc]]           # 28 Detect(P2, P3, P4, P5)
